# Exemple de configuration nginx (ex. /etc/nginx/sites-available/global-transit).
# Le port de proxy_pass DOIT être le PORT de backend/.env (5006 par défaut),
# sinon nginx renvoie « 502 Bad Gateway » sur /api.
server {
    server_name globaltransit-transportservice.com www.globaltransit-transportservice.com;

    root /var/www/global-transit-hub/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5006;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # listen 443 ssl; ssl_certificate ... (géré par certbot)
}
